# Local Postgres for the save server (docs/specs/saving.md). Start: docker compose up -d
# The whole app on a server (docs/deploy.md): docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: citybuilder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citybuilder}
      POSTGRES_DB: citybuilder
    # Localhost only: Docker's published ports skip the host firewall, so never expose Postgres.
    # POSTGRES_PORT picks the host port if 5432 is taken; the app connects inside Docker either way.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citybuilder']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    profiles: [app]
    build:
      context: .
      args:
        VITE_PUBLIC_BASE: ${VITE_PUBLIC_BASE:-/}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://openpolis.space/}
    environment:
      DATABASE_URL: postgres://citybuilder:${POSTGRES_PASSWORD:-citybuilder}@postgres:5432/citybuilder
      # One reverse proxy (your HTTPS server) in front of the app.
      TRUST_PROXY: '1'
      # Sign in with GitHub: set these in .env on the server (docs/deploy.md); off when empty.
      PUBLIC_URL: ${PUBLIC_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Emailed codes for sign-up and password reset (Brevo) and the bot check (Turnstile); off when empty.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Guest trial (D-083): the secret is required; the minutes are optional.
      GUEST_SECRET: ${GUEST_SECRET:-}
      GUEST_NUDGE_MINUTES: ${GUEST_NUDGE_MINUTES:-}
      GUEST_LIMIT_MINUTES: ${GUEST_LIMIT_MINUTES:-}
    # Localhost only: put your HTTPS reverse proxy in front of it. APP_PORT picks the host port.
    ports:
      - '127.0.0.1:${APP_PORT:-8787}:8787'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
